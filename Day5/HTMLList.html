<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" 
  content="width=device-width, initial-scale=1.0">
  <link rel="icon" title=" page/icon" href="/Pictures/icon.jpg">
  
  <title>List</title>
  <style>
    
    
    li{
      float:left;
      padding-right:30px;
    }
    dt{
      background-color: aqua;
      width: 70px;
      height: fit-content;
    }
    dt:hover{
      background-color: blue;
    }

  </style>
</head>
<body>
  <!--ordered list-->

  <ol type="1" start="60">
    <li>apple</li>
    <li>banana</li>
    <li>carrot</li>
  </ol>
  <!--unordered list-->
  <ul style="list-style-type:none;">
    <li >one</li>
    <li>two</li>
    <li>three</li>
  </ul>
  <br>
<!--description lists-->
  <dl>
    <dt>coffee</dt>
    <dd>-it is good</dd>
    <dt>tea</dt>
    <dd>-it makes my day</dd>
  </dl>
</body>
</html>
