<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImageMaps</title>
  <style>
    img{
      height: 500px;
    width: 500px;}
  </style>
</head>
<body>
  <img src="/Pictures/seaimage1.jpg" alt="image not found" usemap="#sea">
  <map name="sea" >
    <!--upon clicking on the sun gives
     output of sun image-->
    <area shape="circle" coords="178,160,45" 
     href="/Pictures/sun.jpg">
  </map>
</body>
</html>
